# Important Notes:
# Every field you add must be added to the root build.gradle expandProps map.

# Project
version=0.1.0
group=dev.ellipog
java_version=21

# Common
minecraft_version=1.21.1
mod_name=Tasked
mod_author=ellipog
mod_id=tasked
license=MIT
credits=
description=A modern questing mod for Fabric and NeoForge.
minecraft_version_range=[1.21.1, 1.22)
## This is the version of minecraft that the 'common' project uses, you can find a list of all versions here
## https://projects.neoforged.net/neoforged/neoform
neo_form_version=1.21.1-20240808.144430
# The version of ParchmentMC that is used, see https://parchmentmc.org/docs/getting-started#choose-a-version for new versions
parchment_minecraft=1.21
parchment_version=2024.11.10

# Fabric
fabric_version=0.109.0+1.21.1
fabric_loader_version=0.16.9

# Armature
## The version Tasked compiles against and declares as a required dependency. Resolved from Maven
## local, published by ../armature -- see _deploy.ps1, which publishes before building this repo
## because Armature's source tree is not on the classpath here. Any Armature change means a bump.
##
## 0.2.0 and not 0.1.0: the quest-viewer seam moved out of Armature into this repo, and the rebuild
## that removed it is a breaking change. The floor also keeps a stale Armature (which still declares
## the viewer entrypoints) from being combined with this Tasked -- both would register the same EMI
## plugin, and EMI would see the category twice.
armature_version=0.2.0

# The three recipe viewers, for the adapters under client/viewer/.
#
# Pinned in one place, and all three `compileOnly`: none reaches a jar or the published POM, and a
# client without any of them loses nothing. EMI and JEI each publish a loader-neutral artefact on
# official Mojang names, which is the only kind of thing common/ can compile; REI publishes no such
# common artefact, so its NeoForge API jar is the one both loader projects read.
emi_version=1.1.24+1.21.1
jei_version=19.57.0.450
rei_version=16.0.799

# Tests. JUnit 5, via the BOM so the platform and jupiter versions cannot drift apart.
junit_version=5.10.2

# KubeJS. `compileOnly` in :neoforge, for the scripting plugin's class and nothing else -- and
# NeoForge only, because KubeJS 7 (the 1.21 line) is: the Fabric artifact on its maven stops at
# 2001.* (1.20.1) while kubejs-neoforge runs through 2101.* and beyond. The shared half of the
# integration (api/TaskedScripts) names none of its types, so it is reusable if that ever changes.
kubejs_version=2101.7.2-build.379

# NeoForge. 21.1.252 rather than 21.1.80 because KubeJS 7 requires a recent 21.1: the version here is
# also the floor the mod declares in neoforge.mods.toml ([21.1.252,)), so this is the NeoForge a pack
# must run -- which is what any pack using KubeJS 7 runs anyway.
neoforge_version=21.1.252
neoforge_loader_version_range=[4,)

# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false

# Local test profiles (Modrinth App). deployFabric / deployNeoForge copy
# the built jars here, deleting the previous ones first.
testModsDirFabric=C:/Users/Ellio/AppData/Roaming/ModrinthApp/profiles/Tasked Fabric/mods
testModsDirNeoForge=C:/Users/Ellio/AppData/Roaming/ModrinthApp/profiles/Tasked NeoForge/mods
