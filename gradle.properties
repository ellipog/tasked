# Important Notes:
# Every field you add must be added to the root build.gradle expandProps map.

# Project
version=0.1.0
group=dev.ellipog
java_version=21

# Common
minecraft_version=1.21.1
mod_name=Tasked
mod_author=ellipog
mod_id=tasked
license=MIT
credits=
description=A modern questing mod for Fabric and NeoForge.
minecraft_version_range=[1.21.1, 1.22)
## This is the version of minecraft that the 'common' project uses, you can find a list of all versions here
## https://projects.neoforged.net/neoforged/neoform
neo_form_version=1.21.1-20240808.144430
# The version of ParchmentMC that is used, see https://parchmentmc.org/docs/getting-started#choose-a-version for new versions
parchment_minecraft=1.21
parchment_version=2024.11.10

# Fabric
fabric_version=0.109.0+1.21.1
fabric_loader_version=0.16.9

# Armature
## The version Tasked compiles against and declares as a required dependency. Resolved from Maven
## local, published by ../armature -- see _deploy.ps1, which publishes before building this repo
## because Armature's source tree is not on the classpath here. Any Armature change means a bump.
armature_version=0.1.0

# Tests. JUnit 5, via the BOM so the platform and jupiter versions cannot drift apart.
junit_version=5.10.2

# NeoForge
neoforge_version=21.1.80
neoforge_loader_version_range=[4,)

# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false

# Local test profiles (Modrinth App). deployFabric / deployNeoForge copy
# the built jars here, deleting the previous ones first.
testModsDirFabric=C:/Users/Ellio/AppData/Roaming/ModrinthApp/profiles/Tasked Fabric/mods
testModsDirNeoForge=C:/Users/Ellio/AppData/Roaming/ModrinthApp/profiles/Tasked NeoForge/mods
